    <!-- GitHub Pages SPA: restore URL from 404.html redirect -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query param from 404.html
        var l = window.location;
        if (l.search.indexOf('?p=') === 0) {
          var decoded = l.search.slice(1)
            .split('&').map(function (s) { return s.replace(/~and~/g, '&'); });
          window.history.replaceState(
            null, null,
            l.pathname.split('/').slice(0, -decoded[0].slice(2).split('/').length).join('/')
              + decoded[0].slice(2)
              + (decoded[1] ? '?' + decoded[1].slice(2) : '')
              + l.hash
          );
        }
      })();
    </script>

    <!-- Inline theme initialisation â€” prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ao-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
