<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Akash Ojha — WordPress Developer</title>
    <script>
      // GitHub Pages SPA redirect
      // Redirects 404s back to index.html with the path encoded as a query string.
      // The main index.html then reads this and restores the URL via replaceState.
      var seg = 1; // number of path segments for the GitHub Pages repo subdirectory
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
